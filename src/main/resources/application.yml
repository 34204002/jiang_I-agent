# =============================================================================
# Jiang I-Agent — 主配置（Key 占位，实际值在 profile 中填写）
# =============================================================================

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expire-days: ${APP_JWT_EXPIRE_DAYS:7}

spring:
  application:
    name: jiang_I-agent
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  # ==================== MySQL ====================
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ==================== Redis ====================
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DB}

  # ==================== Neo4j ====================
  neo4j:
    uri: ${NEO4J_URI}
    authentication:
      username: ${NEO4J_USERNAME}
      password: ${NEO4J_PASSWORD}

  # ==================== RabbitMQ（文档异步处理） ====================
  # 重试/死信参数是设计的一部分：default-requeue-rejected=false 保证重试耗尽进 DLQ，
  # 否则失败消息会无限 requeue、死信队列永远收不到。
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        concurrency: ${RABBITMQ_CONCURRENCY:2}   # 向量化是远程调用，控制并发防 429
        max-concurrency: 4
        prefetch: 1                              # 长任务，一次只取 1 条不积压
        retry:
          enabled: true
          max-attempts: 3                        # 瞬态失败重试 3 次（指数退避）
          initial-interval: 2000
          multiplier: 2.0
          max-interval: 30000
        default-requeue-rejected: false          # 重试耗尽 → 拒绝 → 进死信队列

  # ==================== Spring AI ====================
  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL}
      chat:
        model: ${AI_MODEL}
        temperature: ${AI_TEMPERATURE:0.7}
      embedding:
        model: ${AI_EMBEDDING_MODEL:BAAI/bge-m3}

    vectorstore:
      qdrant:
        host: ${QDRANT_HOST}
        port: ${QDRANT_PORT}
        collection-name: ${QDRANT_COLLECTION:jiang_i_agent_knowledge}

  # ==================== 阿里云 OSS ====================
  oss:
    endpoint: ${OSS_ENDPOINT}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: ${OSS_BUCKET_NAME}
